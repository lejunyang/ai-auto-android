function home(){setHeader('AI Auto','让手机，替你完成。');screen.innerHTML='<div class="greeting"><div class="row between"><div><div class="hello">你好，今天想做点什么</div><h2>有什么，<br>可以交给我？</h2></div><div class="tiny-orbit">'+icon('auto')+'</div></div></div><div class="composer"><label class="small muted" for="task-input" hidden>告诉助理你的任务</label><textarea id="task-input" maxlength="300" rows="2" placeholder="比如，把稍后阅读整理成清单">'+esc(state.task)+'</textarea><div class="composer-foot"><button class="pill" data-action="choose-apps">'+icon('phone')+'选择应用</button><div class="row"><button class="icon-btn" data-action="voice" aria-label="语音输入演示">'+icon('mic')+'</button><button class="icon-btn send" data-action="start-task" aria-label="预览任务计划">'+icon('up')+'</button></div></div></div><div class="quick-chips"><button data-action="prompt" data-text="把稍后阅读整理成清单">整理稍后阅读</button><button data-action="prompt" data-text="提取当前页面的重点">提取页面重点</button></div><div class="section-head"><h3>常用技能</h3><button class="text-btn" data-action="route" data-route="skills">查看全部</button></div><div class="skill-grid"><button class="skill-tile" data-action="open-skill"> <span class="tile-icon">'+icon('book')+'</span><b>整理稍后阅读</b><small>拾光阅读 → 便签</small></button><button class="skill-tile" data-action="overlay-open"><span class="tile-icon mint">'+icon('layers')+'</span><b>看懂当前页面</b><small>悬浮助理 · 概念</small></button></div><button class="teach-card" data-action="route" data-route="record">'+icon('record')+'<span class="grow"><b>教它一次，以后交给它</b><small>录下操作，变成你的专属技能</small></span>'+icon('plus')+'</button><div class="section-head"><h3>最近活动</h3>'+tag('演示数据')+'</div><button class="recent-item" data-action="view-demo-result">'+icon('check')+'<span class="grow"><b>已整理阅读清单</b><small class="muted" style="display:block;margin-top:2px">3 篇文章 · 示例结果</small></span>'+icon('chevron')+'</button>'}
function chooseApps(){openModal('<h2>这次使用哪些应用</h2><p class="page-desc" style="margin-top:9px">仅展示示例应用，不扫描你的设备。</p><div class="stack">'+['拾光阅读','便签'].map((a,i)=>'<label class="app-select">'+(i?noteApp():bookApp())+'<span class="grow"><b>'+a+'</b><small>原型示例应用</small></span><input type="checkbox" name="target-app" value="'+a+'" '+(state.selectedApps.includes(a)?'checked':'')+' aria-label="选择'+a+'"></label>').join('')+'</div><button class="primary full" data-action="save-apps" style="margin-top:20px">使用所选应用</button>')}
function skills(){setHeader('我的技能','把重复操作，留给它。');screen.innerHTML='<div class="row between" style="margin-top:16px"><h2 class="page-heading" style="margin:0">教会它的事</h2><button class="icon-btn soft" data-action="route" data-route="record" aria-label="录制新技能">'+icon('plus')+'</button></div><div class="filter-tabs" aria-label="技能筛选">'+[['all','全部'],['mine','我教的'],['ideas','灵感']].map(([v,t])=>'<button data-action="skill-filter" data-value="'+v+'" class="'+(state.filter===v?'active':'')+'">'+t+'</button>').join('')+'</div><div id="skill-list">'+skillCards()+'</div><button class="teach-card" data-action="route" data-route="record">'+icon('record')+'<span class="grow"><b>录一遍，比写一遍简单</b><small>自动捕获 → 整理 → 检查 → 保存</small></span>'+icon('chevron')+'</button>'}
function skillCards(){if(state.filter==='ideas')return '<button class="card skill-list-card" data-action="idea" data-value="定时整理"><div class="row between"><span class="tile-icon mint" style="margin:0">'+icon('clock')+'</span>'+tag('未来概念','blue')+'</div><h3>到点，帮我整理</h3><p>定时、打开应用时，或手动触发。真正占用屏幕前先确认。</p><div class="bottom"><span class="small muted">触发器 + 技能</span>'+icon('chevron')+'</div></button><button class="card skill-list-card" data-action="idea" data-value="懂我的习惯"><h3>懂你的偏好，不偷学你的生活</h3><p>记住经你确认的规则，随时查看、修改或删除。</p>'+tag('未来概念')+'</button>';
return '<button class="card skill-list-card" data-action="open-skill"><div class="row between"><div class="row">'+bookApp()+noteApp()+'</div>'+tag(state.savedSkill?'本次已保存':'示例技能','green')+'</div><h3>'+esc(state.skillName)+'</h3><p>按你教的路径，筛选、提取，再整理为清单。</p><div class="bottom"><span class="small muted">'+state.savedSteps.filter(s=>s.enabled).length+' 个启用步骤 · 手动触发</span>'+icon('chevron')+'</div></button>'+(state.filter==='all'?'<button class="card skill-list-card" data-action="idea" data-value="页面摘要"><div class="row between"><span class="tile-icon" style="margin:0">'+icon('layers')+'</span>'+tag('未来概念','blue')+'</div><h3>不用切 App，也能问一句</h3><p>悬浮提问，结果就出现在当前页面上。</p><div class="bottom"><span class="small muted">当前页面 + 一句话</span>'+icon('chevron')+'</div></button>':'')}
function record(){setHeader('教它一次','录制 → 整理 → 技能',true);if(!state.recording&&state.recorded.length===0){screen.innerHTML='<h2 class="page-heading">照常操作，<br>剩下的交给我。</h2><p class="page-desc">记录你使用的应用和操作，<br>结束后一起整理成可复用的步骤。</p><div class="notice">语义录制已有基础；自动意图归纳与跨应用技能为概念设计。</div><label class="label" for="record-name">给这次操作起个名字</label><input id="record-name" maxlength="50" value="整理稍后阅读"><div class="section-head"><h3>只记录这些应用</h3><button class="text-btn" data-action="choose-apps">更改</button></div><div class="stack">'+state.selectedApps.map(a=>'<div class="app-select">'+(a==='便签'?noteApp():bookApp())+'<span class="grow"><b>'+a+'</b><small>示例应用 · 仅此任务</small></span>'+icon('check')+'</div>').join('')+'</div><p class="note" style="margin:18px 0">不记录密码、验证码与支付内容。未知操作会标为待补充，不假装录到了。</p><button class="primary full" data-action="begin-record">'+icon('record')+'开始录制演示</button>';return}
const paused=state.recordPaused;screen.innerHTML='<div class="capture-hero"><div class="record-symbol"></div><div class="grow"><div class="record-count">'+state.recorded.length+' <span class="small muted">个步骤</span></div><div class="small muted">'+(paused?'已暂停记录':'正在记录你的操作')+'</div></div>'+tag('模拟事件','amber')+'</div><div class="notice">点“演示下一步”模拟在其他 App 中操作。此页面没有真实录屏或监听。</div><div class="section-head"><h3>操作轨迹</h3><span class="small muted">自动按 App 归组</span></div>'+(state.recorded.length?stepList(state.recorded,false):'<div class="empty">'+icon('record')+'等待第一个操作<br><small>你操作，它记录。</small></div>')+'<div class="sticky-bottom"><button class="secondary" data-action="pause-record">'+icon(paused?'play':'pause')+(paused?'继续':'暂停')+'</button><button class="primary" data-action="next-record" '+(paused||state.recorded.length>=initialSteps.length?'disabled':'')+'>演示下一步</button></div><button class="text-btn full" data-action="finish-record" '+(!state.recorded.length?'disabled':'')+'>结束并整理技能</button><button class="text-btn full" data-action="cancel-record">取消本次录制</button>'}
function stepList(steps,editable=false){return '<div class="steps">'+steps.map((s,i)=>'<div class="step-row" data-step-id="'+s.id+'"><div class="step-rail"><span class="step-number">'+(i+1)+'</span><span class="step-line"></span></div><div class="step-body '+(!s.enabled?'disabled':'')+'"><div class="step-top">'+(editable?'<button class="step-select" data-action="edit-step" data-id="'+s.id+'"><b>'+esc(s.title)+'</b><p>'+esc(s.app)+' · '+esc(s.kind)+'</p></button>':'<div class="grow"><b>'+esc(s.title)+'</b><p>'+esc(s.app)+' · '+esc(s.detail)+'</p></div>')+(editable?icon('edit'):'')+'</div>'+(editable?'<div class="step-actions"><button data-action="toggle-step" data-id="'+s.id+'" aria-label="'+(s.enabled?'停用':'启用')+'步骤 '+(i+1)+'">'+icon(s.enabled?'eye':'pause')+'</button><button data-action="move-up" data-id="'+s.id+'" aria-label="上移步骤 '+(i+1)+'" '+(i===0?'disabled':'')+'>'+icon('up')+'</button><button data-action="move-down" data-id="'+s.id+'" aria-label="下移步骤 '+(i+1)+'" '+(i===steps.length-1?'disabled':'')+'>'+icon('down')+'</button><button data-action="duplicate-step" data-id="'+s.id+'" aria-label="复制步骤 '+(i+1)+'">'+icon('copy')+'</button><button data-action="delete-step" data-id="'+s.id+'" aria-label="删除步骤 '+(i+1)+'">'+icon('trash')+'</button></div>':'')+'</div></div>').join('')+'</div>'}
function remember(){state.undo.push(deep(state.steps));if(state.undo.length>30)state.undo.shift();state.redo=[];state.dirty=true}
function editor(){setHeader('技能编排',state.dirty?'有未保存的修改':'演示技能 · 保存在当前页面内存',true);screen.innerHTML='<div class="row between" style="margin:12px 0 0"><h2 style="font-size:21px">'+esc(state.skillName)+'</h2><button class="icon-btn" data-action="rename-skill" aria-label="修改技能名称">'+icon('edit')+'</button></div><div class="segmented"><button data-action="editor-mode" data-value="steps" class="'+(state.editorMode==='steps'?'active':'')+'">步骤编排</button><button data-action="editor-mode" data-value="language" class="'+(state.editorMode==='language'?'active':'')+'">用一句话表达 '+tag('概念')+'</button></div>'+(state.editorMode==='steps'?'<div class="row between"><span class="small muted">'+state.steps.length+' 步 · '+state.steps.filter(s=>s.enabled).length+' 步启用</span><div class="toolbar" style="margin:0"><button class="icon-btn" data-action="undo" aria-label="撤销" '+(!state.undo.length?'disabled':'')+'>'+icon('undo')+'</button><button class="icon-btn" data-action="redo" aria-label="重做" '+(!state.redo.length?'disabled':'')+'>'+icon('redo')+'</button><button class="icon-btn" data-action="add-step" aria-label="添加步骤">'+icon('plus')+'</button></div></div>'+stepList(state.steps,true)+'<p class="note" style="margin-top:12px">点步骤修改；用箭头调整顺序。等待、失败策略与定位规则收在详情里。</p>':languageView())+'<div class="sticky-bottom"><button class="secondary" data-action="preview-skill">'+icon('eye')+'预检</button><button class="primary" data-action="save-skill">'+icon('check')+'保存技能</button></div><button class="text-btn full" data-action="replay">预览下次运行</button>'}
function description(){return state.plainDescription||'在拾光阅读中打开稍后阅读，筛选最近 '+state.dayRange+' 天收藏的文章，最多提取 '+state.maxItems+' 条标题，去重并整理到便签草稿。保存前请我确认。'}
function languageView(){return '<div class="notice">AI 归纳概念 · 下面是示例描述，可修改。不是调用模型生成的结果。</div><label class="label" for="skill-description">它学会的是意图，而不是死记坐标</label><textarea id="skill-description" rows="5" maxlength="600">'+esc(description())+'</textarea><div class="variable-line"><label for="days">时间范围 / 天</label><input id="days" type="number" min="1" max="365" value="'+esc(state.dayRange)+'"></div><div class="variable-line"><label for="items">最多条目</label><input id="items" type="number" min="1" max="100" value="'+esc(state.maxItems)+'"></div><button class="text-btn full" data-action="update-language">更新示例描述</button><div class="flow-mini" aria-label="意图、步骤和验证之间的关系"><span>自然语言意图</span>'+icon('arrow')+'<span>结构化步骤</span>'+icon('arrow')+'<span>逐步验证</span></div><p class="note">语言修改只更新意图草稿，不自动覆盖步骤。正式实现需生成差异并由你检查，不能把一句话当作可盲目执行的脚本。</p>'+ (state.languageDirty?'<div class="notice amber" style="margin-top:12px">意图已改，步骤尚未同步。下次运行先检查差异。</div>':'')}
function editStep(id){const s=state.steps.find(x=>x.id===id);if(!s)return;openModal('<div class="modal-head"><h2>编辑步骤</h2><button class="icon-btn" data-action="close-modal" aria-label="关闭">'+icon('close')+'</button></div><label class="label" for="step-title">要做什么</label><input id="step-title" maxlength="80" value="'+esc(s.title)+'"><label class="label" for="step-detail">怎么判断做对了</label><textarea id="step-detail" rows="2" maxlength="300">'+esc(s.detail)+'</textarea><label class="label" for="step-app">在哪个应用</label><select id="step-app"><option '+(s.app==='拾光阅读'?'selected':'')+'>拾光阅读</option><option '+(s.app==='便签'?'selected':'')+'>便签</option></select><details style="margin:18px 0"><summary class="small muted" style="cursor:pointer;min-height:44px">高级规则</summary><label class="label" for="step-wait">继续前等待</label><select id="step-wait"><option '+(s.wait==='页面稳定'?'selected':'')+'>页面稳定</option><option '+(s.wait==='目标元素出现'?'selected':'')+'>目标元素出现</option></select><label class="label" for="step-failure">找不到目标时</label><select id="step-failure"><option '+(s.failure==='暂停并请我接管'?'selected':'')+'>暂停并请我接管</option><option '+(s.failure==='结束任务'?'selected':'')+'>结束任务</option></select><p class="note" style="margin-top:10px">设置只作用于原型，不修改 Android 脚本。</p></details><button class="primary full" data-action="apply-step" data-id="'+id+'">保存这一步</button>')}
function session(){setHeader('任务详情','可观察、可接管、随时停止',true);const task=state.task||state.skillName;const labels={plan:'先看看我准备怎么做',running:'正在替你处理',paused:'已暂停，等你回来',confirm:'保存之前，请你确认',done:'已经整理好了',failed:'页面变了，我先停下',stopped:'任务已停止'};screen.innerHTML='<span class="status-bubble"><i class="dot"></i>'+labels[state.session]+'</span><h2 class="session-title">'+esc(task)+'</h2>'+tag('本地交互演示','blue')+'<div class="progress-track"><i style="width:'+({plan:0,running:Math.round(state.sessionStep/4*100),paused:Math.round(state.sessionStep/4*100),confirm:75,done:100,failed:50,stopped:Math.round(state.sessionStep/4*100)}[state.session])+'%"></i></div>'+(state.session==='done'?resultBody():sessionBody());}
function sessionBody(){let html='<div class="steps">'+['打开指定应用','读取并整理内容','生成清单草稿','确认后保存'].map((t,i)=>'<div class="step-row '+(i<state.sessionStep?'done':i===state.sessionStep?'current':'')+'"><div class="step-rail"><span class="step-number">'+(i<state.sessionStep?'✓':i+1)+'</span><span class="step-line"></span></div><div class="step-body"><b>'+t+'</b><p>'+['只访问本次选定范围','每一步执行后重新观察','示例内容，不读取真实页面','涉及写入，交给你决定'][i]+'</p></div></div>').join('')+'</div>';
if(state.session==='plan')html+='<div class="notice" style="margin-top:16px">操作范围：'+esc(state.selectedApps.join('、'))+'。只执行这一项任务，不持续监控。</div><label class="setting-row"><span class="grow"><b>本次允许图像理解</b><small>仅向所选模型发送必要页面图像</small></span><input type="checkbox" id="session-images" '+(state.screenshots?'checked':'')+'></label><button class="primary full" data-action="run-task" style="margin-top:13px">开始执行演示</button>';
if(state.session==='running')html+='<div class="sticky-bottom"><button class="secondary" data-action="pause-task">'+icon('pause')+'暂停</button><button class="danger" data-action="stop-task">'+icon('stop')+'停止</button></div><button class="text-btn full" data-action="session-next">演示下一步</button><button class="text-btn full" data-action="task-fail">模拟页面变化</button><button class="text-btn full" data-action="overlay-running">收起为悬浮状态 · 概念</button>';
if(state.session==='paused')html+='<div class="notice amber" style="margin-top:15px">当前没有新动作。恢复前会重新观察页面。</div><div class="sticky-bottom"><button class="secondary" data-action="run-task">继续演示</button><button class="danger" data-action="stop-task">停止任务</button></div>';
if(state.session==='confirm')html+='<div class="notice amber" style="margin-top:16px"><b>将向「便签」写入阅读清单草稿</b><br>示例含 3 篇文章标题；不发送、不分享。</div><div class="sticky-bottom"><button class="secondary" data-action="stop-task">不保存</button><button class="primary" data-action="confirm-task">确认保存演示</button></div>';

if(state.session==='stopped')html+='<div class="notice" style="margin-top:16px">已取消后续动作，未保存草稿。重新开始会重新生成计划。</div><button class="primary full" style="margin-top:16px" data-action="new-session">重新预览计划</button>';return html}
function resultBody(){return '<div class="result-icon">'+icon('check')+'</div><h3 style="font-size:19px">你的阅读清单</h3><div class="summary-count">3 篇 · 示例结果 · 不代表真实运行</div><ul class="result-list"><li>设计里的少即是多</li><li>如何把知识变成行动</li><li>给注意力留一点空白</li></ul><div class="notice">演示草稿已就绪。真实产品应提供产物入口与可追溯的执行记录。</div><div class="sticky-bottom"><button class="secondary" data-action="open-skill">查看技能</button><button class="primary" data-action="route" data-route="home">回到助理</button></div>'}
function historyView(){setHeader('运行记录','只留下有用的结果。');screen.innerHTML='<h2 class="page-heading">做过的，都在这里。</h2><div class="filter-tabs">'+[['all','全部'],['done','已完成'],['attention','需处理']].map(([v,t])=>'<button data-action="history-filter" data-value="'+v+'" class="'+(v===state.historyFilter?'active':'')+'">'+t+'</button>').join('')+'</div>'+historyCards()+'<p class="note" style="margin:18px 0">示例记录不来自设备。真实产品只保留必要摘要，原图与秘密不进入长期记录。</p>'}

function renderFloat(){const s=state.overlay;const edge=$('edge-light');edge.className='edge-light'+(['thinking','running'].includes(s)?' on':'')+(s==='confirm'?' waiting':'')+(!state.motion?' no-motion':'');if(state.floatMin){$('overlay-layer').innerHTML='<button class="float-pill" data-action="float-expand">'+icon('auto')+(s==='result'?'整理好了，点击查看':'AI Auto · '+({idle:'待命',listening:'等待输入',thinking:'正在思考',running:'正在执行',confirm:'待你确认',paused:'已暂停'}[s]||'待命'))+'</button><button class="floating-dot" data-action="float-expand" aria-label="展开悬浮助理">'+icon('auto')+'</button>';return}
let body='';if(s==='idle')body='<h3>不用离开，也能问。</h3><p>对当前页面提问，或交给我一个任务。</p><div class="float-actions"><button class="secondary" data-action="overlay-state" data-value="listening">'+icon('mic')+'语音演示</button><button class="primary" data-action="overlay-state" data-value="thinking">提取页面重点</button></div>';

if(s==='thinking')body='<h3>先理解，再行动。</h3><p>正在整理页面重点。边缘光表示正在处理，不阻挡页面。</p><div class="float-actions"><button class="secondary" data-action="overlay-state" data-value="idle">取消</button><button class="primary" data-action="overlay-state" data-value="running">演示执行</button></div>';
if(s==='running')body='<h3>正在整理阅读摘要</h3><p>当前：提取重点。每次操作后重新观察，不盲目连续点击。</p><div class="float-actions"><button class="secondary" data-action="overlay-state" data-value="paused">'+icon('pause')+'暂停</button><button class="primary" data-action="overlay-state" data-value="confirm">演示下一步</button></div><button class="text-btn full" data-action="overlay-stop" style="color:#c9d8ef">停止任务</button>';
if(s==='paused')body='<h3>已经暂停。</h3><p>你可以接管手机。恢复之前，先重新看一眼页面。</p><div class="float-actions"><button class="secondary" data-action="overlay-stop">结束</button><button class="primary" data-action="overlay-state" data-value="thinking">重新观察演示</button></div>';
if(s==='confirm')body='<h3>把摘要留到便签？</h3><p>将创建一份本地草稿。不会发送、分享或覆盖原文。</p><div class="float-actions"><button class="secondary" data-action="overlay-stop">暂不保存</button><button class="primary" data-action="overlay-state" data-value="result">保存演示</button></div>';
if(s==='result')body='<div class="row" style="margin-top:13px;color:#c4dfce">'+icon('check')+'<span class="small">整理好了 · 示例结果</span></div><h3>少操作，多一点专注。</h3><div class="float-result"><p>把重复交给系统。<br>把重要选择留给自己。<br>只在需要时，让工具出现。</p></div><div class="float-actions"><button class="secondary" data-action="float-copy">复制摘要</button><button class="primary" data-action="overlay-exit">回到助理</button></div>';
$('overlay-layer').innerHTML='<button class="floating-dot" data-action="float-minimize" aria-label="收起悬浮助理">'+icon('auto')+'</button><section class="floating-panel" aria-label="AI 悬浮层"><div class="row between"><div class="row"><span class="float-brand">'+icon('auto')+'</span><b class="small">AI Auto</b>'+tag('概念')+'</div><button class="icon-btn" data-action="float-minimize" aria-label="最小化">'+icon('down')+'</button></div>'+body+'</section>'}
function design(){setHeader('设计说明','概念不是已实现能力',true);screen.innerHTML='<h2 class="page-heading">不是自动点击器。<br>是随身 Agent。</h2><p class="page-desc">让任务、可复用技能与过程可控成为主角。<br>所有数字、应用和结果均为示例。</p><div class="design-item"><h3>把现有功能重新归位</h3>'+[['运行状态首页','助理首页'],['AI Provider','我的 → AI 模型'],['无障碍与目标包','我的 → 应用与权限'],['桌面桥 / LAN','我的 → 连接电脑'],['录制脚本','技能 → 教它一次'],['动作审计','记录 → 结果与过程']].map(x=>'<div class="mapping"><span class="old">'+x[0]+'</span>'+icon('arrow')+'<span class="new">'+x[1]+'</span></div>').join('')+'</div><div class="design-item"><h3>录制应该学会什么</h3><div class="flow-mini"><span>App 与操作</span>'+icon('arrow')+'<span>步骤 + 意图</span>'+icon('arrow')+'<span>检查后保存</span></div><p>已记录的证据不能被 AI 描述覆盖。保留目标应用、语义锚点、参数、成功条件和人工确认点。跨应用自动分组、语言归纳、分支与条件触发仍是未来能力。</p></div><div class="design-item"><h3>两种回放，不混为一谈</h3><div class="notice"><b>按步骤</b>：稳定流程优先，可预测地重复。<br><b>按意图 · 概念</b>：每次重新观察并规划，差异需确认。</div><p style="margin-top:10px">自然语言是可读的契约，不是执行证据。页面漂移、多个候选、结果不明时停下；不能保证任意 App 自愈。</p></div><div class="design-item"><h3>轻量 Harness 的骨架 · 设想</h3><div class="phase-strip"><span>指令 / 语音</span><i>→</i><span>计划与边界</span><i>→</i><span>单步执行</span><i>→</i><span>验证与记忆</span></div><p style="margin-top:13px">技能库、上下文、工具权限、步骤/时间预算、任务队列、检查点与有限重试共同组成运行时。记忆可查看可删，不把整屏长期保存。</p></div><div class="design-item"><h3>后台待命 ≠ 锁屏自动执行</h3><p>未来用常驻通知承载状态，按需展开悬浮层。占用屏幕的任务串行；锁屏、授权失效、系统杀进程时进入等待或结束，不承诺永久保活。处理动效可关闭。</p></div><div class="design-item"><h3>已有基础与未来设想</h3><p><b>已有基础</b>：Provider、无障碍、AI 会话暂停/停止、语义录制、步骤编辑、LAN 配对。<br><b>未来概念</b>：语音与系统悬浮、任务队列/触发器、意图归纳与差异预览、偏好记忆、App 兼容提示。</p><span class="source">依据：ui/AiAutoAndroidApp.kt、ui/home/HomeScreen.kt、ui/session/SessionScreen.kt、ui/recording/RecordingEditorScreen.kt；docs/next-phase-tasks.md N38–N45。</span><p style="margin-top:10px">截图编辑已有显式授权注入点；普通入口默认无截图。不能把测试或领域层能力等同于全部用户路径可用。</p></div><div class="design-item"><h3>推荐落地顺序</h3><div class="preview-flow"><div class="track"></div><div><span>先换入口和文案<small>保留现有运行时，验证真实使用路径</small></span><span>再做录制与技能体验<small>先步骤可靠，再加 AI 归纳与意图回放</small></span><span>最后扩展系统陪伴<small>悬浮、语音、触发器与生命周期单独验收</small></span></div></div></div><div class="design-item"><h3>这个文件能做与不能做</h3><p>能：切页、模拟任务与录制、编辑/撤销步骤、暂存技能、预览悬浮状态。不能：操作 Android、真实语音、调用模型、持久化设置或正式导出脚本。刷新即恢复示例。</p></div><button class="primary full" data-action="route" data-route="home" style="margin-top:22px">回到原型</button>'}
// 功能用途：场景注释随原型联动，避免在 App 界面堆砌产品说明。
function inspector(){const configs={home:['先问要做什么，\n而不是先问怎么配。','一句话入口占据首屏。常用技能与“教它一次”让能力被看见，配置只保留一枚就绪状态。',[['spark','任务导向','输入目标 → 检查范围 → 开始执行。不是把聊天框套在点击器上。'],['flow','渐进式复杂度','首页只有任务和技能；模型、包名、定位策略进入二级页面。'],['shield','控制权不被藏起来','任务里始终可以暂停、停止；未知结果不静默继续。']]],skills:['重复的事，\n变成可调用的能力。','技能不只是历史脚本，也可以是带参数、触发条件与明确边界的个人工具。',[['record','从示范开始','用你自己的操作路径生成初稿，再由你检查。'],['clock','触发器是下一层','定时、打开 App、手动调用。后台待命不等于无提示占用屏幕。']]],record:['你做一遍。\n它记住“怎么做”。','捕获应用与语义行为，把噪声事件归并为清晰步骤。不是不加分辨地录下所有触摸。',[['phone','按 App 组织轨迹','切换应用成为步骤分组；未授权应用不录制。'],['edit','先整理，再保存','自然语言命名、参数提取、重复步骤合并可由 AI 建议。'],['shield','不把未知说成已记录','自由手势、敏感页面与缺失节点明确标为待补充。']]],editor:['可读的意图，\n可检查的步骤。','普通人看得懂，高级用户改得细。自然语言与结构化步骤并存，不互相冒充。',[['flow','两层表达','步骤是执行与证据；语言是用户意图。改一句话，先看差异。'],['edit','真正可编排','此原型可改名、排序、复制、启停、删除、撤销/重做与保存。'],['eye','预检不等于试运行','只检查计划与范围，不偷偷点一遍；真实执行仍需后置验证。']]],overlay:['需要时出现。\n执行时退后。','全局入口、短语音、屏幕边缘状态与结果浮层。把辅助放在当前上下文里。',[['layers','三种大小','边缘入口 → 状态胶囊 → 结果浮层，点击收起或展开。'],['mic','语音是入口，不是常听','按需唤起，明确录音状态；本原型仅模拟波形。'],['phone','边缘光有状态含义','蓝色处理，琥珀色等待决定。暂停、结束后熄灭。']]],history:['留住结果，\n也留住可追溯性。','把执行审计转成用户能读懂的活动记录：做了什么、结果在哪里、哪里需要处理。',[['clock','不是日志瀑布','先结果、再步骤，技术信息按需展开。'],['shield','失败不是黑箱','说清停在哪一步、是否已产生动作、如何安全恢复。']]],settings:['设置好边界。\n不用每天配置。','模型、权限与电脑连接各归其位。电脑连接是可选项，手机本身仍是独立助理。',[['spark','Provider → AI 模型','服务地址和模型前置，超时等高级项后置。'],['shield','权限按需申请','首次无障碍披露不省略；图像理解按任务单独授权。'],['computer','手机不是电脑的附属品','保留扫码与手工路径，不把桌面连接设为默认前提。']]],design:['一个轻量 Harness，\n一种日常的表达。','不是承诺无人值守地做一切，而是在用户边界内，把观察、工具调用、验证和复用串起来。',[['flow','能力层不等于界面层','先重组已有能力，再逐步实现并验收概念功能。'],['branch','关键产品分歧','稳定流程走步骤，变化流程走受控意图；不把两者混成“自动回放”。']]],session:['你说目标。\n它把过程说清。','用计划和步骤传递确定性；需要决定时再打断，异常时停止，而不是制造假进度。',[['eye','每一步都可验证','模拟“计划 → 执行 → 验证 → 确认 → 结果”的用户体验。'],['pause','随时收回控制权','暂停、停止和页面变化示例都可以点击体验。']]],provider:['技术配置，\n也可以很平静。','保留真实必要字段，不让协议术语主导用户体验。',[['shield','不收真实秘密','HTML 原型禁用 API Key 输入，也不发请求。']]],permissions:['授权要清楚，\n不是越少越好。','精简日常界面，不精简首次醒目披露和系统人工授权。',[['shield','按应用与任务授权','白名单、会话图像开关与系统服务是不同边界。']]],connection:['一次可信配对，\n协同而不失控。','保留扫码、手工码、短指纹核对与断开入口，默认不连接。',[['computer','配对路径已有基础','本页仅重新组织用户表达；不创建真实连接。']]],setup:['第一次用，\n只做必要的事。','接模型、选应用、理解并启用执行能力。其余在真正需要时再介绍。',[['settings','渐进式引导','拒绝授权仍能浏览技能；不让一项权限堵住所有体验。']]]};const c=configs[state.route]||configs.home;$('inspector').innerHTML='<div class="inspector-title">场景意图</div><h2>'+c[0].replace('\n','<br>')+'</h2><p>'+c[1]+'</p>'+c[2].map(f=>'<div class="feature">'+icon(f[0])+'<div><strong>'+f[1]+'</strong><p>'+f[2]+'</p></div></div>').join('')+(state.route==='overlay'?'<div class="inspector-controls">'+[['idle','待命'],['listening','语音'],['thinking','思考'],['running','执行'],['confirm','待确认'],['result','结果']].map(([v,t])=>'<button class="'+(state.overlay===v?'selected':'')+'" data-action="overlay-state" data-value="'+v+'">'+t+'</button>').join('')+'<button data-action="toggle-motion">'+(state.motion?'关闭动效':'开启动效')+'</button><button data-action="overlay-reset">重置场景</button></div>':'')+'<div class="concept-label">'+tag('设计边界')+'<p style="margin-top:10px">界面是可交互的，设备能力是模拟的。<br>悬浮 / 语音 / 意图技能 / 后台触发为未来设想；不代表 Android 已实现。</p></div>'}
// 功能用途：模态框保留键盘焦点，表单输入按文本处理，避免把用户输入解释为 HTML。
function openModal(content){lastFocus=document.activeElement;$('modal-layer').innerHTML='<div class="modal-scrim"><section class="modal" role="dialog" aria-modal="true" aria-label="原型操作"><div class="modal-handle"></div>'+content+'</section></div>';const first=$('modal-layer').querySelector('button,input,textarea,select,summary');if(first)first.focus()}
function closeModal(){const had=$('modal-layer').innerHTML!=='';$('modal-layer').innerHTML='';if(had&&lastFocus&&lastFocus.isConnected)lastFocus.focus();lastFocus=null}
function saveSkill(){if(!state.steps.length){toast('至少保留一个步骤后再保存');return false}state.savedSteps=deep(state.steps);state.savedName=state.skillName;state.savedIntent={dayRange:state.dayRange,maxItems:state.maxItems,plainDescription:state.plainDescription,languageDirty:state.languageDirty};state.dirty=false;state.savedSkill=true;toast('已保存到本次演示；刷新页面会恢复示例');return true}
function addHistory(status,label){state.history.unshift({title:state.task||state.skillName,status,label:'本次演示 · '+label});if(state.history.length>12)state.history.pop()}
function showPrecheck(){const enabled=state.steps.filter(s=>s.enabled);const outside=enabled.some(s=>!state.selectedApps.includes(s.app));const needs=!enabled.length||outside||state.languageDirty;openModal('<div class="modal-head"><h2>预检结果 · 本地模拟</h2><button class="icon-btn" data-action="close-modal" aria-label="关闭预检">'+icon('close')+'</button></div><div class="notice '+(needs?'amber':'')+'" style="margin:13px 0">'+(needs?'还有需要检查的内容':'原型中的结构检查通过')+'</div><div class="stack"><div class="row">'+icon(enabled.length?'check':'info')+'<span>'+enabled.length+' 个启用步骤</span></div><div class="row">'+icon(outside?'info':'check')+'<span>'+(outside?'有步骤超出本次应用范围':'步骤应用在本次范围内')+'</span></div><div class="row">'+icon(state.languageDirty?'info':'check')+'<span>'+(state.languageDirty?'自然语言已改，需核对步骤差异':'意图描述未发生额外修改')+'</span></div></div><p class="note" style="margin:20px 0">没有访问设备、匹配真实节点或验证 App 兼容性。此结果不是“真实设备可执行”的证明。</p><button class="primary full" data-action="close-modal">回到编辑</button>')}
function dispatch(action,b){const id=Number(b.dataset.id);switch(action){
case 'route':route(b.dataset.route);break;
case 'back':route(['provider','permissions','connection','setup'].includes(state.route)?'settings':state.route==='editor'?'skills':'home');break;
case 'reset':openModal('<h2>重置演示？</h2><p class="page-desc" style="margin-top:12px">会清除本页内存中的编辑和任务状态，不影响项目或设备。</p><button class="primary full" data-action="confirm-reset">恢复初始示例</button><button class="text-btn full" data-action="close-modal">保留当前演示</button>');break;
case 'confirm-reset':location.hash='home';location.reload();break;
case 'close-modal':closeModal();break;
case 'health':openModal('<h2>随时可以开始</h2><p class="page-desc" style="margin-top:10px">以下是预设状态，不是设备检测结果。</p><div class="stack">'+['AI 模型 · 演示已配置','执行能力 · 演示已启用','允许的应用 · '+state.selectedApps.length+' 个示例'].map(t=>'<div class="row">'+icon('check')+t+'</div>').join('')+'</div><button class="primary full" data-action="route" data-route="settings" style="margin-top:20px">管理能力与权限</button><button class="text-btn full" data-action="close-modal">知道了</button>');break;
case 'choose-apps':chooseApps();break;
case 'save-apps':{const apps=Array.from(document.querySelectorAll('[name=target-app]:checked')).map(x=>x.value);if(!apps.length){toast('请至少选择一个示例应用');break}state.selectedApps=apps;closeModal();render();toast('本次范围已更新');break}
case 'prompt':state.task=b.dataset.text;render();$('task-input').focus();break;
case 'voice':openModal('<h2>语音输入 · 概念演示</h2><div class="voice-wave" style="background:#21314a;border-radius:20px">'+Array.from({length:12},(_,i)=>'<i style="--i:'+i+'"></i>').join('')+'</div><p class="page-desc">“把稍后阅读整理成清单”</p><div class="notice">未调用麦克风。正式产品需按需申请麦克风权限，并提供文字替代。</div><button class="primary full" data-action="voice-use" style="margin-top:18px">使用这句示例</button><button class="text-btn full" data-action="close-modal">取消</button>');break;
case 'voice-use':state.task='把稍后阅读整理成清单';closeModal();route('home');break;
case 'start-task':state.task=($('task-input')?.value||state.task).trim();if(!state.task){toast('先说说你想完成什么');$('task-input')?.focus();break}if(!state.ready){route('setup');break}state.session='plan';state.sessionStep=0;route('session');break;
case 'run-task':state.screenshots=$('session-images')?$('session-images').checked:state.screenshots;state.session='running';render();break;
case 'session-next':if(state.session!=='running')break;state.sessionStep=Math.min(3,state.sessionStep+1);if(state.sessionStep===3)state.session='confirm';render();break;
case 'pause-task':state.session='paused';render();break;
case 'stop-task':clearTimeout(autoTimer);state.session='stopped';addHistory('attention','已停止');render();break;
case 'confirm-task':state.session='done';state.sessionStep=4;addHistory('done','已完成');render();break;
case 'task-fail':state.session='failed';addHistory('attention','页面变化');render();break;
case 'manual-takeover':state.session='paused';render();toast('演示已暂停；真实恢复需重新观察');break;
case 'reobserve':state.session='running';render();toast('模拟重新观察通过；尚未继续执行');break;
case 'new-session':state.session='plan';state.sessionStep=0;render();break;
case 'view-demo-result':state.task='整理稍后阅读';state.session='done';state.sessionStep=4;route('session');break;
case 'open-skill':state.steps=deep(state.savedSteps);state.skillName=state.savedName;Object.assign(state,state.savedIntent);state.undo=[];state.redo=[];state.dirty=false;state.editorMode='steps';route('editor');break;
case 'skill-filter':state.filter=b.dataset.value;render();break;
case 'history-filter':state.historyFilter=b.dataset.value;render();break;
case 'history-open':state.task=b.dataset.title;state.session=b.dataset.status==='done'?'done':'failed';state.sessionStep=state.session==='done'?4:2;route('session');break;
case 'begin-record':{const name=$('record-name').value.trim();if(!name){toast('请先给技能起个名字');break}state.skillName=name;state.recording=true;state.recordPaused=false;state.recorded=[];render();break}
case 'next-record':if(!state.recordPaused&&state.recorded.length<initialSteps.length){const s=deep(initialSteps[state.recorded.length]);if(!state.selectedApps.includes(s.app)){state.recordPaused=true;toast('下一步不在允许范围内，录制已暂停');render();break}state.recorded.push(s);render();screen.scrollTop=screen.scrollHeight;}break;
case 'pause-record':state.recordPaused=!state.recordPaused;render();break;
case 'finish-record':if(!state.recorded.length)break;state.steps=deep(state.recorded);state.recording=false;state.dirty=true;state.undo=[];state.redo=[];state.editorMode='steps';route('editor');toast('已整理为步骤初稿，请检查后保存');break;
case 'cancel-record':state.recording=false;state.recorded=[];state.recordPaused=false;render();toast('本次录制演示已取消');break;
case 'editor-mode':state.editorMode=b.dataset.value;render();break;
case 'edit-step':editStep(id);break;
case 'apply-step':{const title=$('step-title').value.trim(),detail=$('step-detail').value.trim();if(!title||!detail){toast('请填写操作和成功条件');break}remember();const s=state.steps.find(x=>x.id===id);Object.assign(s,{title,detail,app:$('step-app').value,wait:$('step-wait').value,failure:$('step-failure').value});closeModal();render();break}
case 'toggle-step':remember();state.steps.find(s=>s.id===id).enabled=!state.steps.find(s=>s.id===id).enabled;render();break;
case 'move-up':case 'move-down':{const i=state.steps.findIndex(s=>s.id===id),j=i+(action==='move-up'?-1:1);if(j<0||j>=state.steps.length)break;remember();[state.steps[i],state.steps[j]]=[state.steps[j],state.steps[i]];render();break}
case 'duplicate-step':{const i=state.steps.findIndex(s=>s.id===id);remember();const s=deep(state.steps[i]);s.id=nextId++;s.title+='（副本）';state.steps.splice(i+1,0,s);render();toast('已复制，可撤销');break}
case 'delete-step':remember();state.steps=state.steps.filter(s=>s.id!==id);render();toast('已删除，可撤销');break;
case 'add-step':remember();state.steps.push({id:nextId++,title:'等待页面稳定',app:state.selectedApps[0],detail:'界面内容稳定后继续',enabled:true,kind:'等待'});render();screen.scrollTop=screen.scrollHeight;break;
case 'undo':if(state.undo.length){state.redo.push(deep(state.steps));state.steps=state.undo.pop();state.dirty=true;render()}break;
case 'redo':if(state.redo.length){state.undo.push(deep(state.steps));state.steps=state.redo.pop();state.dirty=true;render()}break;
case 'rename-skill':openModal('<h2>技能名称</h2><label class="label" for="skill-name">以后用这个名字找到它</label><input id="skill-name" maxlength="50" value="'+esc(state.skillName)+'"><button class="primary full" data-action="apply-name" style="margin-top:18px">保存名称</button><button class="text-btn full" data-action="close-modal">取消</button>');break;
case 'apply-name':{const value=$('skill-name').value.trim();if(!value){toast('名称不能为空');break}state.skillName=value;state.dirty=true;closeModal();render();break}
case 'save-skill':if(saveSkill())render();break;
case 'save-leave':if(saveSkill())route(b.dataset.route,true);break;
case 'discard-leave':state.steps=deep(state.savedSteps);state.skillName=state.savedName;Object.assign(state,state.savedIntent);state.dirty=false;route(b.dataset.route,true);break;
case 'preview-skill':showPrecheck();break;
case 'replay':if(state.languageDirty){showPrecheck();break}if(state.dirty&&!saveSkill())break;state.task=state.skillName;state.session='plan';state.sessionStep=0;route('session');toast('演示的是通用运行过程，不执行真实脚本');break;
case 'update-language':{const days=Number($('days').value),items=Number($('items').value);if(!Number.isInteger(days)||days<1||days>365||!Number.isInteger(items)||items<1||items>100){toast('时间需为 1–365 天，条目需为 1–100 的整数');break}state.dayRange=String(days);state.maxItems=String(items);state.plainDescription='';state.languageDirty=true;state.dirty=true;render();toast('只更新意图草稿，不自动更改步骤');break}
case 'idea':openModal('<h2>'+esc(b.dataset.value)+' · 未来概念</h2><p class="page-desc" style="margin-top:15px">需要独立实现触发器、权限边界、运行预算和失败恢复；此原型不接入后台任务。</p><div class="stack"><button class="primary" data-action="overlay-open">体验悬浮概念</button><button class="secondary" data-action="close-modal">回到技能</button></div>');break;
case 'overlay-open':state.overlay='idle';state.floatMin=false;route('overlay');break;
case 'overlay-running':state.overlay='running';state.floatMin=true;route('overlay');break;
case 'overlay-state':state.overlay=b.dataset.value;state.floatMin=false;renderFloat();inspector();break;
case 'float-minimize':state.floatMin=true;renderFloat();break;
case 'float-expand':state.floatMin=false;renderFloat();break;
case 'overlay-exit':state.overlay='idle';state.floatMin=false;route('home');break;
case 'overlay-stop':state.overlay='idle';renderFloat();inspector();toast('演示任务已停止，边缘光已熄灭');break;
case 'overlay-reset':state.overlay='idle';state.floatMin=false;render();break;
case 'toggle-motion':state.motion=!state.motion;renderFloat();inspector();break;
case 'float-copy':{const text='把重复交给系统，把重要选择留给自己，只在需要时让工具出现。';if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast('摘要已复制')).catch(()=>copyFallback(text))}else copyFallback(text);break}
case 'toggle-setting':state.settings[b.dataset.key]=!state.settings[b.dataset.key];render();toast('已更改演示开关，不影响系统');break;
case 'provider-save':case 'provider-test':{let valid=false;try{const u=new URL($('provider-url').value);valid=u.protocol==='https:'&&!u.username&&!u.password&&!u.search&&!u.hash}catch(_){}const timeout=Number($('provider-timeout').value);if(!valid||!$('provider-model').value.trim()||!Number.isInteger(timeout)||timeout<1||timeout>300){toast('请填写有效 HTTPS 地址、模型和 1–300 秒超时');break}toast(action==='provider-test'?'表单检查通过；未发送网络请求':'演示配置已接受；未写入任何配置文件');break}
case 'permission-demo':if(!$('permission-consent').checked){toast('请先勾选了解读取与操作范围');break}openModal('<h2>系统授权指引 · 演示</h2><div class="preview-flow"><div class="track"></div><div><span>打开系统无障碍设置</span><span>选择 AI 安卓自动化执行服务</span><span>核对系统披露，手动开启</span><span>回到 App 复核状态</span></div></div><p class="note">本页没有打开系统设置，也不会把点击指引视为真实授权成功。</p><button class="primary full" data-action="close-modal" style="margin-top:15px">了解了</button>');break;
case 'pair-manual':openModal('<h2>手工邀请码 · 演示</h2><label class="label" for="pair-input">请输入 DEMO 查看下一步</label><input id="pair-input" autocomplete="off" maxlength="20" placeholder="DEMO"><button class="primary full" data-action="pair-code" style="margin-top:16px">检查演示码</button><button class="text-btn full" data-action="close-modal">取消</button>');break;
case 'pair-code':if($('pair-input').value.trim()!=='DEMO'){toast('这里只接受 DEMO，不处理真实邀请码');break}pairDemo();break;
case 'pair-demo':pairDemo();break;
case 'pair-confirm':closeModal();toast('配对路径演示结束，未建立真实连接');break;
case 'setup-done':state.ready=true;route('home');toast('已进入预设就绪场景，不代表设备已授权');break;
case 'setup-skip':state.ready=false;route('skills');break;
}}
function pairDemo(){openModal('<h2>核对电脑邀请</h2><p class="page-desc" style="margin-top:12px">演示电脑 · 局域网连接</p><div class="card"><span class="small muted">短指纹示意</span><h3 style="font-size:23px;margin-top:7px;letter-spacing:2px">DEMO · ONLY</h3></div><p class="note" style="margin:15px 0">正式产品需核对双方指纹、有效期与网络。这里没有真实二维码或密钥。</p><button class="primary full" data-action="pair-confirm">一致，完成配对演示</button><button class="text-btn full" data-action="close-modal">取消</button>')}
function copyFallback(text){openModal('<h2>复制摘要</h2><label class="label" for="copy-text">浏览器限制剪贴板，可手动复制</label><textarea id="copy-text" rows="4" readonly>'+esc(text)+'</textarea><button class="primary full" data-action="close-modal" style="margin-top:16px">完成</button>');$('copy-text').select()}
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;dispatch(b.dataset.action,b)});
document.addEventListener('input',event=>{if(event.target.id==='task-input')state.task=event.target.value;if(event.target.id==='skill-description'){state.plainDescription=event.target.value;state.languageDirty=true;state.dirty=true}});
document.addEventListener('keydown',event=>{const modal=$('modal-layer').querySelector('.modal');if(event.key==='Escape'&&modal){closeModal();return}if(event.key==='Tab'&&modal){const focusable=Array.from(modal.querySelectorAll('button:not(:disabled),input:not(:disabled),textarea,select,summary')).filter(el=>el.getClientRects().length);const first=focusable[0],last=focusable[focusable.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus()}}});
window.addEventListener('hashchange',()=>{const target=location.hash.slice(1);if(target!==state.route)route(target)});
window.addEventListener('beforeunload',event=>{if(state.dirty){event.preventDefault();event.returnValue=''}});
const requested=location.hash.slice(1);if(['home','skills','record','editor','overlay','history','settings','session','design','setup','provider','connection','permissions'].includes(requested)){state.route=requested;if(['skills','record','editor'].includes(requested))state.tab='skills';if(requested==='history')state.tab='history';if(['settings','setup','provider','connection','permissions'].includes(requested))state.tab='settings'}
render();hydrate();
}catch(error){console.error(error);const box=document.getElementById('screen');if(box)box.innerHTML='<div class="notice error">交互初始化失败。请刷新页面；原型不连接设备，不会执行任何动作。</div>';}})();
</script>
