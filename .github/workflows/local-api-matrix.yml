# 配置用途：跨平台验证 N52 编排、N47 场景和 N34 统计的离线契约，不替代真实 Emulator 矩阵。
name: Local API Matrix Semantics

on:
  pull_request:
    paths:
      - "test-lab/matrix/local/**"
      - "test-lab/runner/**"
      - "test-lab/artifacts/**"
      - ".github/workflows/local-api-matrix.yml"
  push:
    branches:
      - main
    paths:
      - "test-lab/matrix/local/**"
      - "test-lab/runner/**"
      - "test-lab/artifacts/**"
      - ".github/workflows/local-api-matrix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fake-matrix-smoke:
    name: Fake matrix smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Validate N34 bounded artifact semantics
        run: npm run smoke --prefix test-lab/artifacts

      - name: Validate N47 schemas
        run: npm run schema --prefix test-lab/runner

      - name: Validate N47 portable scenario contracts
        run: >-
          node --test
          test-lab/runner/test/aggregation.test.mjs
          test-lab/runner/test/fixture-contract.test.mjs
          test-lab/runner/test/runner.test.mjs
          test-lab/runner/test/schema.test.mjs

      - name: Validate N47 Unix executable adapter
        if: runner.os != 'Windows'
        run: >-
          node --test
          test-lab/runner/test/aactl-adapter.test.mjs
          test-lab/runner/test/aactl-lifecycle.test.mjs
          test-lab/runner/test/aactl-semantic-ports.test.mjs
          test-lab/runner/test/aactl-stdin-input.test.mjs

      - name: Validate N52 fixed fake matrix
        run: npm run smoke --prefix test-lab/matrix/local
