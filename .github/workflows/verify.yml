# 配置用途：在受支持平台验证工具链元数据、Go、协议、Skills 和 Android 构建。
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-metadata:
    name: Repository metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify pinned toolchains and layout
        run: ./scripts/verify-toolchains.sh --metadata-only

      # The pins must also be installable, not merely well-formed. `.tool-versions`
      # used to name a Java build the upstream index had stopped publishing, and
      # nothing caught it because no check ever tried to resolve the pins.
      - name: Install osdk
        run: |
          curl -fsSL https://raw.githubusercontent.com/lejunyang/one-sdk/main/install.sh \
            | sh -s -- --no-modify-shell --install-dir "$HOME/.local/bin"
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"

      # `outdated` resolves every pin against its upstream index and exits
      # non-zero when one cannot be resolved, without downloading anything. A
      # lock file would also catch this, but it is per-platform and would have to
      # be regenerated on every host in the matrix to stay diff-clean.
      - name: Resolve every pin against its upstream index
        run: |
          osdk --yes trust .
          osdk outdated

  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Check Go formatting
        shell: bash
        run: sh ./scripts/check-go-format.sh

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Build aactl
        shell: bash
        run: |
          suffix=
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            suffix=.exe
          fi
          go build -trimpath \
            -ldflags "-s -w -X github.com/lejunyang/ai-auto-android/internal/cli.Version=ci" \
            -o "$RUNNER_TEMP/aactl$suffix" \
            ./cmd/aactl

  portability:
    name: Portable Node (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Validate toolchain roots and emulator paths
        run: >-
          node --test
          scripts/workflow-portability.test.mjs
          scripts/toolchain-environment.test.mjs
          scripts/emulator/runner.test.mjs
          scripts/native-fixture-matrix/run.test.mjs

  protocol:
    name: Protocol fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Validate schemas and fixtures
        run: npm test --prefix protocol

  skills:
    name: Portable skills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Validate skills and CLI examples
        run: make skills-smoke

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # The JDK and the Android SDK packages come from osdk.toml, not from
      # setup-java plus a hand-written sdkmanager line. Those two spellings of
      # the same versions had already drifted apart from what local builds used,
      # and the sdkmanager form additionally cannot express "the platform package
      # whose ApiLevel is exactly 36": `platforms;android-36` is a manifest path
      # here but a prefix elsewhere. One pinned file removes both problems.
      - name: Install osdk
        run: |
          curl -fsSL https://raw.githubusercontent.com/lejunyang/one-sdk/main/install.sh \
            | sh -s -- --no-modify-shell --install-dir "$HOME/.local/bin"
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Trust the project toolchain pins
        run: osdk --yes trust .

      - name: Install the pinned toolchain
        run: osdk --yes install

      # Gradle is deliberately NOT pinned by osdk: android/gradle/wrapper pins
      # 9.3.1 together with a distributionSha256Sum, and that checksum is the
      # stronger guarantee. setup-gradle is kept for its dependency cache only.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c # v4.4.2

      - name: Test, assemble, and lint debug build
        run: make android-verify
