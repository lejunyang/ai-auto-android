# 配置用途：在受支持平台验证工具链元数据、Go、协议、Skills 和 Android 构建。
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-metadata:
    name: Repository metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify pinned toolchains and layout
        run: ./scripts/verify-toolchains.sh --metadata-only

      # pin 不仅要格式正确，还必须真的能装上。`.tool-versions` 里曾写着一个上游索引
      # 已停止发布的 Java 版本，却长期无人发现 —— 因为当时没有任何检查真正去解析这些
      # pin，只断言了文件包含对应字符串。
      - name: Install osdk
        run: |
          curl -fsSL https://raw.githubusercontent.com/lejunyang/one-sdk/main/install.sh \
            | sh -s -- --no-modify-shell --install-dir "$HOME/.local/bin"
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"

      # `outdated` 会把每个 pin 都对上游索引解析一遍，有任何一个解析不出就以非零码
      # 退出，且全程不下载任何制品。锁文件同样能发现这类问题，但它是分平台的，要保持
      # diff 干净就得在矩阵里每个 host 上各重新生成一份，代价不划算。
      - name: Resolve every pin against its upstream index
        run: |
          osdk --yes trust .
          osdk outdated

  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Check Go formatting
        shell: bash
        run: sh ./scripts/check-go-format.sh

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Build aactl
        shell: bash
        run: |
          suffix=
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            suffix=.exe
          fi
          go build -trimpath \
            -ldflags "-s -w -X github.com/lejunyang/ai-auto-android/internal/cli.Version=ci" \
            -o "$RUNNER_TEMP/aactl$suffix" \
            ./cmd/aactl

  portability:
    name: Portable Node (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Validate toolchain roots and emulator paths
        run: >-
          node --test
          scripts/workflow-portability.test.mjs
          scripts/toolchain-environment.test.mjs
          scripts/emulator/runner.test.mjs
          scripts/native-fixture-matrix/run.test.mjs

  protocol:
    name: Protocol fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Validate schemas and fixtures
        run: npm test --prefix protocol

  skills:
    name: Portable skills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Validate skills and CLI examples
        run: make skills-smoke

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # JDK 与 Android SDK 包一律来自 osdk.toml，不再用 setup-java 加一行手写的
      # sdkmanager 声明。那种写法把同一批版本讲了第二遍，且已经和本地构建实际用的版本
      # 漂移开了；此外它无法表达「ApiLevel 恰为 36 的那个平台包」—— `platforms;android-36`
      # 在 sdkmanager 里是精确清单路径，在别处却是前缀。改由单一 pin 文件声明可同时
      # 解决这两个问题。
      - name: Install osdk
        run: |
          curl -fsSL https://raw.githubusercontent.com/lejunyang/one-sdk/main/install.sh \
            | sh -s -- --no-modify-shell --install-dir "$HOME/.local/bin"
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Trust the project toolchain pins
        run: osdk --yes trust .

      - name: Install the pinned toolchain
        run: osdk --yes install

      # gradle 刻意不交给 osdk pin：android/gradle/wrapper 用 distributionUrl 加
      # distributionSha256Sum 锁定 9.3.1，该校验和是更强的保障。这里保留 setup-gradle
      # 仅为使用它的依赖缓存。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c # v4.4.2

      - name: Test, assemble, and lint debug build
        run: make android-verify
