# 配置用途：跨平台验证固定 Emulator Runner 的配置、锁、错误语义和命令路径，不替代本地设备矩阵。
name: Emulator Runner Smoke

on:
  pull_request:
    paths:
      - "scripts/emulator/**"
      - ".github/workflows/emulator-runner.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/emulator/**"
      - ".github/workflows/emulator-runner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-smoke:
    name: Runner smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Run deterministic runner tests
        run: node --test scripts/emulator/runner.test.mjs

      - name: Verify command-line failure envelope
        shell: bash
        run: |
          output_file="$RUNNER_TEMP/emulator-runner-output.json"
          if node scripts/emulator/cli.mjs verify \
            --profile api-33 \
            --sdk-root "$RUNNER_TEMP/missing-sdk" \
            --avd-root "$RUNNER_TEMP/avd" \
            --java-home "$JAVA_HOME" \
            --state-root "$RUNNER_TEMP/state" > "$output_file"; then
            printf 'expected missing SDK verification to fail\n' >&2
            exit 1
          fi
          node -e '
            const result = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            if (result.ok !== false || result.error?.code !== "SDK_TOOL_MISSING") process.exit(1);
          ' "$output_file"
