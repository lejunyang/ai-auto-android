# 配置用途：构建并发布四平台完整/精简归档、同版 helper 与独立 App APK，统一核对 SHA-256。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version, with or without a leading v
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Resolve release version
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag=$GITHUB_REF_NAME
            version=${GITHUB_REF_NAME#v}
          else
            version=${INPUT_VERSION#v}
            tag=v$version
          fi
          if [[ ! "$version" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            printf 'invalid release version: %s\n' "$version" >&2
            exit 2
          fi
          printf 'tag=%s\nversion=%s\n' "$tag" "$version" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      # 发布产物必须由仓库 pin 的那批版本构建，所以 JDK 与 Android SDK 取自 osdk.toml，
      # 而不是在这里再声明第二份版本。理由同 verify.yml 中的对应步骤。
      # 官方 Action 使用最新 osdk；项目工具与许可证仍由后续显式步骤处理。
      - name: Set up latest osdk
        uses: lejunyang/one-sdk@main
        with:
          version: latest
          install-tools: "false"
          install-deps: "false"

      - name: Trust the project toolchain pins
        run: osdk --yes trust .

      - name: Install the pinned toolchain
        # 发布校验和 CLI 构建也需要项目 pin 的 Go/Node；--yes 不代表接受 Android SDK 许可证。
        # 将许可证同意限定到本请求的 android-sdk-license，避免隐式接受其它协议。
        run: osdk --yes install go node java android-platforms android-build-tools android-platform-tools -o accept-license=android-sdk-license

      # gradle 仍由 wrapper 自身的 distributionUrl 加 distributionSha256Sum 锁定；
      # 这里保留 setup-gradle 仅为使用它的依赖缓存。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c # v4.4.2

      - name: Run Go, protocol, and skill checks
        run: make test

      - name: Run Android tests and lint
        run: make android-test android-lint

      # scripts/release.sh 通过 ANDROID_GRADLEW 构建 APK，需要 osdk exec 注入的
      # ANDROID_HOME / ANDROID_SDK_ROOT 等 SDK 环境变量；缺了它 Gradle 会报
      # 「SDK location not found」。
      - name: Build release bundle
        env:
          VERSION: ${{ steps.release.outputs.version }}
          # 发布者明确同意获取和打包受 Android SDK 许可约束的官方 Platform-Tools。
          # 与安装步骤 accept-license 的口径一致；--yes 本身不代表同意该许可。
          AACTL_ACCEPT_ANDROID_SDK_LICENSE: android-sdk-license
        run: osdk exec -t go -t node -t java -t android-platforms -t android-build-tools -t android-platform-tools -- make release VERSION="$VERSION"

      - name: Verify release checksums
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ steps.release.outputs.version }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            printf '%s\n' \
              '默认推荐完整包：含官方 ADB、同版 aactl-displayd.apk 和官方 NOTICE.txt。' \
              '精简包（_slim）含 CLI/helper，需自备官方 Platform-Tools。App debug APK 单独下载。' \
              '发布资产改为八个归档和独立 App APK，不再单独发布裸 CLI；请核对 SHA256SUMS。' \
              '升级 v1 helper 前，必须先用旧 CLI 执行 display stop，再整体替换 CLI/helper。' \
              '官方二进制再分发的许可风险由发布者自行评估，详见 docs/security-distribution.md。' \
              > "$RUNNER_TEMP/release-bundles-notes.md"
            gh release create "$TAG" dist/* \
              --generate-notes \
              --notes-file "$RUNNER_TEMP/release-bundles-notes.md" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG"
          fi
